name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Deliberately without the `--fix` flag that the package.json `lint`
      # script carries: CI must report problems, not rewrite files.
      - name: Lint
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build
